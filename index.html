<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ماشین‌حساب مهندسی فیزیک و الکترونیک</title>
  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text-main: var(--tg-theme-text-color, #f8fafc);
      --text-muted: var(--tg-theme-hint-color, #94a3b8);
      --primary: var(--tg-theme-button-color, #38bdf8);
      --primary-txt: var(--tg-theme-button-text-color, #0f172a);
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --key-num: #334155;
      --key-op: #475569;
      --display-bg: #020617;
      --border: #334155;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--bg-color); color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    .calc-container {
      max-width: 480px; margin: 0 auto; height: 100vh;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 8px 10px calc(12px + env(safe-area-inset-bottom)) 10px;
    }

    /* نوار هدر و تب‌ها */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .app-brand { font-size: 14px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 5px; }

    .tabs {
      display: flex; gap: 4px; background: var(--display-bg);
      padding: 3px; border-radius: 10px; border: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1; min-width: 70px; padding: 7px 4px; font-size: 12px; font-weight: 600;
      background: transparent; color: var(--text-muted); border: none; border-radius: 7px;
      cursor: pointer; text-align: center; white-space: nowrap; transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--primary); color: var(--primary-txt);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }

    /* نمایشگر دیجیتال */
    .screen-card {
      background: var(--display-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 105px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }
    .screen-status {
      display: flex; justify-content: space-between; font-size: 11px;
      color: var(--accent); font-family: monospace; letter-spacing: 0.5px;
    }
    .screen-expr {
      font-size: 14px; color: var(--text-muted); text-align: left;
      direction: ltr; min-height: 20px; overflow-x: auto; white-space: nowrap;
    }
    .screen-val {
      font-size: 26px; font-weight: 700; color: #38bdf8; text-align: left;
      direction: ltr; overflow-x: auto; white-space: nowrap;
    }

    /* بدنه تب‌ها */
    .tab-content { flex: 1; display: none; flex-direction: column; justify-content: flex-end; }
    .tab-content.active { display: flex; }

    /* کیپد ماشین حساب */
    .keypad-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    }
    .key-btn {
      background: var(--key-num); color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
      font-size: 18px; font-weight: 600; padding: 14px 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.08s, filter 0.1s;
    }
    .key-btn:active { transform: scale(0.95); filter: brightness(1.25); }
    .key-btn.op { background: var(--key-op); color: var(--primary); font-size: 16px; }
    .key-btn.func { background: #1e293b; color: #f59e0b; font-size: 14px; }
    .key-btn.danger { background: #450a0a; color: var(--danger); border-color: #991b1b; }
    .key-btn.equal {
      background: var(--primary); color: var(--primary-txt);
      font-size: 22px; font-weight: 700;
    }

    /* ماژول‌های مهندسی فیزیک و الکترونیک */
    .module-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px; margin-bottom: 6px;
      max-height: 380px; overflow-y: auto;
    }
    .param-group { margin-bottom: 8px; }
    .param-group label {
      display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 3px;
    }
    .param-row { display: flex; gap: 6px; }
    .mini-input, .mini-select {
      flex: 1; background: var(--display-bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-main); padding: 8px 10px;
      font-size: 13px; text-align: left; direction: ltr;
    }
    .calc-btn-action {
      width: 100%; background: var(--primary); color: var(--primary-txt);
      border: none; border-radius: 10px; padding: 11px; font-size: 13px;
      font-weight: 700; cursor: pointer; margin-top: 5px;
    }

    /* کدهای رنگ مقاومت */
    .color-band-preview {
      height: 24px; border-radius: 6px; display: flex; overflow: hidden;
      margin: 8px 0; border: 1px solid #475569;
    }
    .band-slice { flex: 1; height: 100%; }

    /* حل گام‌به‌گام و تاریخچه */
    .history-tape {
      max-height: 180px; overflow-y: auto; background: var(--display-bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    }
    .tape-item {
      padding: 6px; border-bottom: 1px dashed var(--border);
      font-size: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .tape-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="calc-container">
  <!-- هدر -->
  <header>
    <div class="app-brand">⚡ ماشین‌حساب تخصصی مهندسی</div>
    <div id="degree-mode" style="font-size: 11px; color: var(--primary); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px;">DEG</div>
  </header>

  <!-- تب‌های بخش‌بندی شده -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('basic')">حسابگر</button>
    <button class="tab-btn" onclick="switchTab('elec')">الکترونیک</button>
    <button class="tab-btn" onclick="switchTab('phy')">فیزیک دهم</button>
    <button class="tab-btn" onclick="switchTab('conv')">تبدیل واحد</button>
    <button class="tab-btn" onclick="switchTab('hist')">تاریخچه</button>
  </div>

  <!-- نمایشگر دیجیتال مهندسی -->
  <div class="screen-card">
    <div class="screen-status">
      <span id="stat-mode">READY</span>
      <span id="stat-mem">M: 0</span>
    </div>
    <div class="screen-expr" id="expr-line"></div>
    <div class="screen-val" id="res-line">0</div>
  </div>

  <!-- تب ۱: ماشین‌حساب علمی و مهندسی استاندارد -->
  <div id="tab-basic" class="tab-content active">
    <div class="keypad-grid">
      <button class="key-btn func" onclick="execFunc('sin')">sin</button>
      <button class="key-btn func" onclick="execFunc('cos')">cos</button>
      <button class="key-btn func" onclick="execFunc('sqrt')">√</button>
      <button class="key-btn func" onclick="execFunc('sqr')">x²</button>

      <button class="key-btn func" onclick="execFunc('inv')">1/x</button>
      <button class="key-btn func" onclick="insertVal('3.14159')">π</button>
      <button class="key-btn danger" onclick="clearCalc()">AC</button>
      <button class="key-btn op" onclick="backspace()">⌫</button>

      <button class="key-btn" onclick="insertVal('7')">7</button>
      <button class="key-btn" onclick="insertVal('8')">8</button>
      <button class="key-btn" onclick="insertVal('9')">9</button>
      <button class="key-btn op" onclick="insertVal('/')">÷</button>

      <button class="key-btn" onclick="insertVal('4')">4</button>
      <button class="key-btn" onclick="insertVal('5')">5</button>
      <button class="key-btn" onclick="insertVal('6')">6</button>
      <button class="key-btn op" onclick="insertVal('*')">×</button>

      <button class="key-btn" onclick="insertVal('1')">1</button>
      <button class="key-btn" onclick="insertVal('2')">2</button>
      <button class="key-btn" onclick="insertVal('3')">3</button>
      <button class="key-btn op" onclick="insertVal('-')">−</button>

      <button class="key-btn" onclick="insertVal('0')">0</button>
      <button class="key-btn" onclick="insertVal('.')">.</button>
      <button class="key-btn op" onclick="insertVal('+')">+</button>
      <button class="key-btn equal" onclick="evalCalc()">=</button>
    </div>
  </div>

  <!-- تب ۲: مهندسی الکترونیک -->
  <div id="tab-elec" class="tab-content">
    <div class="module-card">
      <div style="font-weight: 700; font-size: 13px; color: var(--primary); margin-bottom: 6px;">🔌 قانون اهم (V = I × R)</div>
      <div class="param-row">
        <input id="ohm-v" class="mini-input" placeholder="ولتاژ V">
        <input id="ohm-i" class="mini-input" placeholder="جریان A">
        <input id="ohm-r" class="mini-input" placeholder="مقاومت Ω">
      </div>
      <button class="calc-btn-action" onclick="calcOhm()">محاسبه متغیر خالی</button>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">

      <div style="font-weight: 700; font-size: 13px; color: var(--primary); margin-bottom: 6px;">⚡ مقاومت معادل (سری و موازی)</div>
      <div class="param-row">
        <input id="res-r1" class="mini-input" placeholder="مقاومت R1 (Ω)">
        <input id="res-r2" class="mini-input" placeholder="مقاومت R2 (Ω)">
      </div>
      <div class="param-row" style="margin-top: 4px;">
        <button class="calc-btn-action" style="background: #334155;" onclick="calcResistors('series')">اتصال سری</button>
        <button class="calc-btn-action" style="background: #334155;" onclick="calcResistors('parallel')">اتصال موازی</button>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">

      <div style="font-weight: 700; font-size: 13px; color: var(--primary); margin-bottom: 4px;">🎨 رمزگشای کد ۴ رنگ مقاومت</div>
      <div class="color-band-preview">
        <div id="cb-preview-1" class="band-slice" style="background: #964B00;"></div>
        <div id="cb-preview-2" class="band-slice" style="background: #000000;"></div>
        <div id="cb-preview-3" class="band-slice" style="background: #FF0000;"></div>
        <div id="cb-preview-4" class="band-slice" style="background: #D4AF37;"></div>
      </div>
      <div class="param-row">
        <select id="cb-1" class="mini-select" onchange="updateBandColors()"></select>
        <select id="cb-2" class="mini-select" onchange="updateBandColors()"></select>
        <select id="cb-3" class="mini-select" onchange="updateBandColors()"></select>
        <select id="cb-4" class="mini-select" onchange="updateBandColors()"></select>
      </div>
      <button class="calc-btn-action" onclick="calcBands()">خواندن مقدار مقاومت</button>
    </div>
  </div>

  <!-- تب ۳: فرمول‌های فیزیک دهم -->
  <div id="tab-phy" class="tab-content">
    <div class="module-card">
      <div style="font-weight: 700; font-size: 13px; color: var(--primary); margin-bottom: 6px;">💧 چگالی (ρ = m / V)</div>
      <div class="param-row">
        <input id="phy-m" class="mini-input" placeholder="جرم m (kg)">
        <input id="phy-v" class="mini-input" placeholder="حجم V (m³)">
      </div>
      <button class="calc-btn-action" onclick="calcDensity()">محاسبه چگالی</button>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">

      <div style="font-weight: 700; font-size: 13px; color: var(--primary); margin-bottom: 6px;">🌊 فشار شاره در عمق (P = ρgh)</div>
      <div class="param-row">
        <input id="phy-h" class="mini-input" placeholder="عمق h (m)">
        <input id="phy-rho" class="mini-input" placeholder="چگالی ρ" value="1000">
        <input id="phy-g" class="mini-input" placeholder="گرانش g" value="9.8">
      </div>
      <button class="calc-btn-action" onclick="calcFluidPressure()">محاسبه فشار شاره (Pa)</button>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">

      <div style="font-weight: 700; font-size: 13px; color: var(--primary); margin-bottom: 6px;">🚗 تندی و سرعت متوسط (v = Δx / Δt)</div>
      <div class="param-row">
        <input id="phy-dx" class="mini-input" placeholder="مسافت (متر)">
        <input id="phy-dt" class="mini-input" placeholder="زمان (ثانیه)">
      </div>
      <button class="calc-btn-action" onclick="calcSpeed()">محاسبه تندی (m/s و km/h)</button>
    </div>
  </div>

  <!-- تب ۴: تبدیل واحدهای مهندسی -->
  <div id="tab-conv" class="tab-content">
    <div class="module-card">
      <div class="param-group">
        <label>دسته‌بندی تبدیل:</label>
        <select id="conv-cat" class="mini-select" onchange="renderConvUnits()">
          <option value="length">طول (Length)</option>
          <option value="mass">جرم (Mass)</option>
          <option value="pressure">فشار (Pressure)</option>
          <option value="energy">توان و انرژی (Energy)</option>
        </select>
      </div>
      <div class="param-row">
        <input id="conv-val" class="mini-input" placeholder="مقدار ورودی" value="1">
      </div>
      <div class="param-row" style="margin-top: 6px;">
        <select id="conv-from" class="mini-select"></select>
        <div style="display:flex; align-items:center; color:var(--primary);">➔</div>
        <select id="conv-to" class="mini-select"></select>
      </div>
      <button class="calc-btn-action" onclick="calcConversion()">انجام تبدیل واحد</button>
    </div>
  </div>

  <!-- تب ۵: تاریخچه نواری محاسبات -->
  <div id="tab-hist" class="tab-content">
    <div class="module-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 12px; font-weight: 700;">نوار تاریخچه محاسبات:</span>
        <button onclick="clearHistory()" style="background: none; border: none; color: var(--danger); font-size: 11px; cursor: pointer;">پاک‌سازی</button>
      </div>
      <div class="history-tape" id="history-box"></div>
      <button class="calc-btn-action" style="margin-top: 8px;" onclick="copyCurrentResult()">📋 کپی آخرین پاسخ</button>
    </div>
  </div>
</div>

<script>
  'use strict';

  // راه‌اندازی SDK ایتا
  const app = window.Eitaa?.WebApp;
  try {
    if (app) {
      app.ready();
      app.expand();
      if (app.BackButton) {
        app.BackButton.onClick(() => switchTab('basic'));
      }
    }
  } catch(e) {}

  let expr = '';
  let result = '0';
  let historyList = [];

  const exprLine = document.getElementById('expr-line');
  const resLine = document.getElementById('res-line');
  const statMode = document.getElementById('stat-mode');

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    event?.target?.classList?.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
    
    if (app?.BackButton) {
      if (tabId !== 'basic') app.BackButton.show();
      else app.BackButton.hide();
    }
  }

  /* توابع ماشین حساب استاندارد */
  function insertVal(v) {
    if (result !== '0' && expr === '') {
      // اگر نتیجه قبلی هست و علامت جدید زدی ادامه بده
      if ('+-*/'.includes(v)) expr = result;
    }
    expr += v;
    exprLine.textContent = expr;
  }

  function clearCalc() {
    expr = '';
    result = '0';
    exprLine.textContent = '';
    resLine.textContent = '0';
    statMode.textContent = 'CLEARED';
  }

  function backspace() {
    expr = expr.slice(0, -1);
    exprLine.textContent = expr;
  }

  function evalCalc() {
    if (!expr) return;
    try {
      // جایگزینی امن کاراکترها و محاسبه
      const sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/');
      const calcRes = Function(`'use strict'; return (${sanitized})`)();
      result = String(Number(calcRes.toFixed(6)));
      resLine.textContent = result;
      statMode.textContent = 'EVAL OK';
      addHistory(expr, result);
      expr = '';
    } catch (e) {
      resLine.textContent = 'Error';
      statMode.textContent = 'SYNTAX ERR';
    }
  }

  function execFunc(fn) {
    const cur = parseFloat(resLine.textContent) || 0;
    let res = 0;
    let label = '';

    if (fn === 'sin') { res = Math.sin(cur * Math.PI / 180); label = `sin(${cur}°)`; }
    else if (fn === 'cos') { res = Math.cos(cur * Math.PI / 180); label = `cos(${cur}°)`; }
    else if (fn === 'sqrt') { res = Math.sqrt(cur); label = `√(${cur})`; }
    else if (fn === 'sqr') { res = Math.pow(cur, 2); label = `(${cur})²`; }
    else if (fn === 'inv') { res = cur !== 0 ? (1 / cur) : 0; label = `1/(${cur})`; }

    result = String(Number(res.toFixed(6)));
    exprLine.textContent = label;
    resLine.textContent = result;
    addHistory(label, result);
  }

  /* تاریخچه */
  function addHistory(op, res) {
    historyList.unshift({ op, res, time: new Date().toLocaleTimeString('fa-IR') });
    if (historyList.length > 20) historyList.pop();
    renderHistory();
  }

  function renderHistory() {
    const box = document.getElementById('history-box');
    box.innerHTML = '';
    if (historyList.length === 0) {
      box.innerHTML = '<div style="font-size:11px; color:#64748b; text-align:center;">تاریخچه‌ای موجود نیست</div>';
      return;
    }
    historyList.forEach(item => {
      const d = document.createElement('div');
      d.className = 'tape-item';
      d.innerHTML = `<span>${item.op} = <b>${item.res}</b></span><span style="font-size:10px; color:#64748b;">${item.time}</span>`;
      box.appendChild(d);
    });
  }

  function clearHistory() {
    historyList = [];
    renderHistory();
  }

  function copyCurrentResult() {
    const txt = resLine.textContent;
    navigator.clipboard?.writeText(txt).then(() => {
      if (app?.showAlert) app.showAlert(`مقدار ${txt} کپی شد!`);
      else alert(`مقدار ${txt} کپی شد!`);
    });
  }

  /* توابع فیزیک و الکترونیک */
  function calcOhm() {
    const v = parseFloat(document.getElementById('ohm-v').value);
    const i = parseFloat(document.getElementById('ohm-i').value);
    const r = parseFloat(document.getElementById('ohm-r').value);

    let res = 0, formula = '';
    if (isNaN(v) && !isNaN(i) && !isNaN(r)) {
      res = i * r; formula = `V = I × R = ${i} × ${r}`;
    } else if (isNaN(i) && !isNaN(v) && !isNaN(r)) {
      res = v / r; formula = `I = V / R = ${v} / ${r}`;
    } else if (isNaN(r) && !isNaN(v) && !isNaN(i)) {
      res = v / i; formula = `R = V / I = ${v} / ${i}`;
    } else {
      alert('دقیقاً ۲ مقدار را وارد کرده و متغیر مجهول را خالی بگذارید.');
      return;
    }
    result = String(Number(res.toFixed(4)));
    exprLine.textContent = formula;
    resLine.textContent = result;
    statMode.textContent = 'OHM SOLVE';
    addHistory(formula, result);
    switchTab('basic');
  }

  function calcResistors(type) {
    const r1 = parseFloat(document.getElementById('res-r1').value);
    const r2 = parseFloat(document.getElementById('res-r2').value);
    if (isNaN(r1) || isNaN(r2) || r1 <= 0 || r2 <= 0) return alert('دو مقاومت معتبر و مثبت وارد کنید.');

    let res = 0, formula = '';
    if (type === 'series') {
      res = r1 + r2; formula = `R_eq = ${r1} + ${r2} (سری)`;
    } else {
      res = (r1 * r2) / (r1 + r2); formula = `R_eq = (${r1}×${r2})/(${r1}+${r2}) (موازی)`;
    }
    result = String(Number(res.toFixed(4)));
    exprLine.textContent = formula;
    resLine.textContent = result + ' Ω';
    statMode.textContent = 'RESISTOR';
    addHistory(formula, result + ' Ω');
    switchTab('basic');
  }

  function calcDensity() {
    const m = parseFloat(document.getElementById('phy-m').value);
    const v = parseFloat(document.getElementById('phy-v').value);
    if (isNaN(m) || isNaN(v) || v <= 0) return alert('مقادیر جرم و حجم مثبت وارد کنید.');
    const rho = m / v;
    const formula = `ρ = ${m} / ${v}`;
    result = String(Number(rho.toFixed(4)));
    exprLine.textContent = formula + ' kg/m³';
    resLine.textContent = result;
    statMode.textContent = 'DENSITY';
    addHistory(formula, result + ' kg/m³');
    switchTab('basic');
  }

  function calcFluidPressure() {
    const h = parseFloat(document.getElementById('phy-h').value);
    const rho = parseFloat(document.getElementById('phy-rho').value) || 1000;
    const g = parseFloat(document.getElementById('phy-g').value) || 9.8;
    if (isNaN(h) || h < 0) return alert('عمق معتبر وارد کنید.');
    const p = rho * g * h;
    const formula = `P = ${rho} × ${g} × ${h}`;
    result = String(Number(p.toFixed(2)));
    exprLine.textContent = formula + ' Pa';
    resLine.textContent = result;
    statMode.textContent = 'PRESSURE';
    addHistory(formula, result + ' Pa');
    switchTab('basic');
  }

  function calcSpeed() {
    const dx = parseFloat(document.getElementById('phy-dx').value);
    const dt = parseFloat(document.getElementById('phy-dt').value);
    if (isNaN(dx) || isNaN(dt) || dt <= 0) return alert('مقادیر مسافت و زمان مثبت وارد کنید.');
    const v = dx / dt;
    const vKmh = v * 3.6;
    const formula = `v = ${dx}m / ${dt}s`;
    result = `${v.toFixed(2)} m/s (${vKmh.toFixed(2)} km/h)`;
    exprLine.textContent = formula;
    resLine.textContent = result;
    statMode.textContent = 'SPEED';
    addHistory(formula, result);
    switchTab('basic');
  }

  /* نوارهای رنگی مقاومت */
  const colorData = [
    { name: 'سیاه (0)', val: 0, mult: 1, color: '#000000' },
    { name: 'قهوه‌ای (1)', val: 1, mult: 10, color: '#8B4513' },
    { name: 'قرمز (2)', val: 2, mult: 100, color: '#EF4444' },
    { name: 'نارنجی (3)', val: 3, mult: 1000, color: '#F97316' },
    { name: 'زرد (4)', val: 4, mult: 10000, color: '#EAB308' },
    { name: 'سبز (5)', val: 5, mult: 100000, color: '#22C55E' },
    { name: 'آبی (6)', val: 6, mult: 1000000, color: '#3B82F6' },
    { name: 'بنفش (7)', val: 7, mult: 10000000, color: '#A855F7' },
    { name: 'خاکستری (8)', val: 8, mult: 100000000, color: '#6B7280' },
    { name: 'سفید (9)', val: 9, mult: 1000000000, color: '#F8FAFC' }
  ];

  function setupColorBands() {
    const b1 = document.getElementById('cb-1');
    const b2 = document.getElementById('cb-2');
    const b3 = document.getElementById('cb-3');
    const b4 = document.getElementById('cb-4');

    colorData.slice(1).forEach(c => b1.innerHTML += `<option value="${c.val}">${c.name}</option>`);
    colorData.forEach(c => b2.innerHTML += `<option value="${c.val}">${c.name}</option>`);
    colorData.forEach(c => b3.innerHTML += `<option value="${c.mult}">${c.name}</option>`);
    
    b4.innerHTML = `
      <option value="5">طلایی (±5%)</option>
      <option value="10">نقره‌ای (±10%)</option>
      <option value="1">قهوه‌ای (±1%)</option>
      <option value="2">قرمز (±2%)</option>
    `;
    b3.selectedIndex = 2; // قرمز x100 پیش‌فرض
  }

  function updateBandColors() {
    const c1 = colorData.find(c => c.val == document.getElementById('cb-1').value);
    const c2 = colorData.find(c => c.val == document.getElementById('cb-2').value);
    const c3 = colorData.find(c => c.mult == document.getElementById('cb-3').value);
    
    document.getElementById('cb-preview-1').style.background = c1?.color || '#8B4513';
    document.getElementById('cb-preview-2').style.background = c2?.color || '#000';
    document.getElementById('cb-preview-3').style.background = c3?.color || '#EF4444';
  }

  function calcBands() {
    const d1 = parseInt(document.getElementById('cb-1').value);
    const d2 = parseInt(document.getElementById('cb-2').value);
    const mult = parseFloat(document.getElementById('cb-3').value);
    const tol = document.getElementById('cb-4').value;

    const ohms = ((d1 * 10) + d2) * mult;
    let label = ohms + ' Ω';
    if (ohms >= 1000000) label = (ohms / 1000000) + ' MΩ';
    else if (ohms >= 1000) label = (ohms / 1000) + ' kΩ';

    exprLine.textContent = `مقاومت: ${label}`;
    resLine.textContent = `±${tol}%`;
    statMode.textContent = 'COLOR CODE';
    addHistory(`کد رنگی`, `${label} ±${tol}%`);
    switchTab('basic');
  }

  /* تبدیل واحدها */
  const unitTable = {
    length: { 'متر': 1, 'سانتی‌متر': 0.01, 'میلی‌متر': 0.001, 'کیلومتر': 1000, 'اینچ': 0.0254 },
    mass: { 'کیلوگرم': 1, 'گرم': 0.001, 'میلی‌گرم': 0.000001, 'تن': 1000, 'پوند': 0.453592 },
    pressure: { 'پاسکال': 1, 'کیلوپاسکال': 1000, 'بار': 100000, 'اتمسفر': 101325 },
    energy: { 'ژول': 1, 'کیلوژول': 1000, 'وات‌ساعت': 3600, 'کیلووات‌ساعت': 3600000, 'کالری': 4.184 }
  };

  function renderConvUnits() {
    const cat = document.getElementById('conv-cat').value;
    const from = document.getElementById('conv-from');
    const to = document.getElementById('conv-to');
    from.innerHTML = ''; to.innerHTML = '';
    Object.keys(unitTable[cat]).forEach((u, i) => {
      from.innerHTML += `<option value="${u}">${u}</option>`;
      to.innerHTML += `<option value="${u}" ${i === 1 ? 'selected' : ''}>${u}</option>`;
    });
  }

  function calcConversion() {
    const cat = document.getElementById('conv-cat').value;
    const val = parseFloat(document.getElementById('conv-val').value) || 0;
    const fromUnit = document.getElementById('conv-from').value;
    const toUnit = document.getElementById('conv-to').value;

    const baseVal = val * unitTable[cat][fromUnit];
    const finalVal = baseVal / unitTable[cat][toUnit];

    const formula = `${val} ${fromUnit} ➔ ${toUnit}`;
    result = String(Number(finalVal.toFixed(6)));
    exprLine.textContent = formula;
    resLine.textContent = result;
    statMode.textContent = 'CONVERT';
    addHistory(formula, result);
    switchTab('basic');
  }

  // راه‌اندازی اولیه‌ها
  setupColorBands();
  renderConvUnits();
</script>

</body>
</html>
