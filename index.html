<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جعبه‌ابزار مهندسی و الکترونیک | مینی‌اپ ایتا</title>
    <!-- لود SDK رسمی ایتا -->
    <script src="https://eitaa.com/js/webapp.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- هدر -->
    <header class="bg-cyan-700 text-white p-4 shadow-md text-center">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-microchip ml-2"></i>جعبه‌ابزار الکترونیک و فیزیک</h1>
        <p id="userStatus" class="text-xs text-cyan-200 mt-1">ابزار تخصصی دهم ریاضی</p>
    </header>

    <!-- جایگاه تبلیغات -->
    <div class="bg-amber-100 border-b border-amber-200 p-2 text-center text-xs text-amber-800">
        <span class="inline-block bg-amber-200 px-2 py-0.5 rounded text-[10px] font-bold ml-1">تبلیغات</span>
        فضای بنر درآمدزایی (تپسل / یکتانت)
    </div>

    <!-- محتوا -->
    <main class="container mx-auto p-4 max-w-md flex-grow space-y-4">
        
        <!-- ابزار ۱: قانون اهم -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-sm font-bold text-cyan-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> محاسبه‌گر قانون اهم (V = I × R)
            </h2>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">ولتاژ (V - ولت):</label>
                    <input type="number" id="ohmVoltage" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="خالی بگذارید برای محاسبه">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">جریان (I - آمپر):</label>
                    <input type="number" id="ohmCurrent" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="خالی بگذارید">
                </div>
            </div>
            <div class="mb-3">
                <label class="block text-[11px] text-slate-500 mb-1">مقاومت (R - اهم):</label>
                <input type="number" id="ohmResistance" class="w-full p-2 border rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 outline-none" placeholder="خالی بگذارید">
            </div>
            <button onclick="calculateOhm()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-medium p-2.5 rounded-xl text-xs transition shadow">محاسبه پارامتر مجهول</button>
            <div id="ohmResult" class="mt-2 text-center text-xs font-bold text-cyan-900 bg-cyan-50 p-2 rounded-xl hidden"></div>
        </div>

        <!-- ابزار ۲: فیزیک دهم (محاسبه شتاب) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-sm font-bold text-cyan-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-gauge-high"></i> محاسبه شتاب متوسط (Δv / Δt)
            </h2>
            <div class="grid grid-cols-2 gap-2 mb-3">
                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">تغییر سرعت (Δv):</label>
                    <input type="number" id="deltaV" class="w-full p-2 border rounded-xl text-sm outline-none" placeholder="متر بر ثانیه">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">تغییر زمان (Δt):</label>
                    <input type="number" id="deltaT" class="w-full p-2 border rounded-xl text-sm outline-none" placeholder="ثانیه">
                </div>
            </div>
            <button onclick="calculateAcceleration()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-medium p-2.5 rounded-xl text-xs transition shadow">محاسبه شتاب</button>
            <div id="accResult" class="mt-2 text-center text-xs font-bold text-cyan-900 bg-cyan-50 p-2 rounded-xl hidden"></div>
        </div>

    </main>

    <footer class="bg-slate-200 border-t border-slate-300 text-center py-2 text-[11px] text-slate-500">
        ابزار مهندسی الکترک | مینی‌اپ ایتا
    </footer>

    <!-- جاوااسکریپت محاسبات -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Eitaa && window.Eitaa.WebApp) {
                window.Eitaa.WebApp.ready();
                window.Eitaa.WebApp.expand();
                document.getElementById('userStatus').innerText = 'متصل به بستر مینی‌اپ ایتا';
            }
        });

        function calculateOhm() {
            let V = parseFloat(document.getElementById('ohmVoltage').value);
            let I = parseFloat(document.getElementById('ohmCurrent').value);
            let R = parseFloat(document.getElementById('ohmResistance').value);
            let resBox = document.getElementById('ohmResult');
            resBox.classList.remove('hidden');

            if (isNaN(V) && !isNaN(I) && !isNaN(R)) {
                resBox.innerText = `ولتاژ محاسبه شده: ${(I * R).toFixed(2)} ولت`;
            } else if (!isNaN(V) && isNaN(I) && !isNaN(R)) {
                if(R === 0) { resBox.innerText = 'مقاومت نمی‌تواند صفر باشد!'; return; }
                resBox.innerText = `جریان محاسبه شده: ${(V / R).toFixed(4)} آمپر`;
            } else if (!isNaN(V) && !isNaN(I) && isNaN(R)) {
                if(I === 0) { resBox.innerText = 'جریان نمی‌تواند صفر باشد!'; return; }
                resBox.innerText = `مقاومت محاسبه شده: ${(V / I).toFixed(2)} اهم`;
            } else {
                resBox.innerText = 'لطفاً دقیقا دو مقدار را وارد کنید و یکی را خالی بگذارید.';
            }
        }

        function calculateAcceleration() {
            let dv = parseFloat(document.getElementById('deltaV').value);
            let dt = parseFloat(document.getElementById('deltaT').value);
            let resBox = document.getElementById('accResult');
            resBox.classList.remove('hidden');

            if (isNaN(dv) || isNaN(dt)) {
                resBox.innerText = 'لطفاً هر دو مقدار را وارد کنید.';
                return;
            }
            if (dt === 0) {
                resBox.innerText = 'زمان نمی‌تواند صفر باشد!';
                return;
            }
            resBox.innerText = `شتاب متوسط: ${(dv / dt).toFixed(2)} متر بر مجذور ثانیه (m/s²)`;
        }
    </script>
</body>
</html>
